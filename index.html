<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Sniper Lab — Forex Milkers SA</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3; --mut:#8b949e; --grn:#3fb950; --red:#f85149; --amb:#d29922; --blu:#58a6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--txt); line-height:1.55; padding:16px; max-width:760px; margin:0 auto; }
  h1 { font-size:22px; } h2 { font-size:16px; margin:26px 0 10px; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:14px; }
  .banner { background:var(--panel); border:1px solid var(--amb); border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:16px; }
  .banner b { color:var(--amb); }
  .tabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { background:var(--panel); border:1px solid var(--line); color:var(--mut); padding:7px 14px; border-radius:20px; cursor:pointer; font-size:13px; }
  .tabs button.on { background:var(--blu); color:#fff; border-color:var(--blu); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:12px; }
  .inst { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .inst button { flex:1; min-width:100px; background:var(--panel); border:1px solid var(--line); color:var(--txt); padding:10px; border-radius:8px; cursor:pointer; }
  .inst button.on { border-color:var(--blu); background:#1c2a3a; }
  .inst .nm { font-weight:600; } .inst .px { font-size:12px; color:var(--mut); }
  .sig { text-align:center; padding:18px 12px; }
  .sig .dir { font-size:26px; font-weight:700; }
  .sig .det { color:var(--mut); font-size:13px; margin-top:4px; }
  .levels { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-top:14px; }
  .lvl { background:#0d1117; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  .lvl .k { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--mut); }
  .lvl .v { font-size:15px; font-weight:600; margin-top:2px; }
  .check { margin-top:12px; font-size:13px; }
  .check div { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #21262d; }
  .ok { color:var(--grn); } .no { color:var(--red); } .wt { color:var(--amb); }
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:left; color:var(--mut); font-weight:600; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid #21262d; }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { font-size:12px; color:var(--mut); display:block; margin-bottom:2px; }
  input { width:100%; background:#0d1117; border:1px solid var(--line); color:var(--txt); padding:8px; border-radius:6px; font-size:14px; }
  .btn { background:var(--blu); color:#fff; border:none; padding:9px 16px; border-radius:6px; font-size:14px; cursor:pointer; }
  .btn.sec { background:var(--panel); border:1px solid var(--line); color:var(--txt); }
  .res { font-size:15px; margin-top:10px; }
  .muted { color:var(--mut); font-size:12px; }
  .foot { font-size:11px; color:var(--mut); margin-top:26px; border-top:1px solid #21262d; padding-top:12px; }
  textarea { width:100%; background:#0d1117; border:1px solid var(--line); color:var(--txt); border-radius:6px; font-family:monospace; font-size:12px; padding:8px; min-height:110px; }
  .hidden { display:none; }
  #status { font-size:11px; color:var(--mut); margin:6px 0 10px; }
</style>
</head>

<style>
  /* ===== FM NEON RED THEME + ACCESS GATE ===== */
  :root { --bg:#050505; --panel:rgba(18,18,26,.74); --line:#26262f; --txt:#f4f4f5; --mut:#a1a1b0;
    --grn:#22c55e; --red:#ff2a3c; --amb:#ffb020; --blu:#ff2a3c; --neon:#ef1f2b; }
  body { background:#050505 !important;
    background-image: radial-gradient(1100px 640px at 72% -8%, rgba(239,31,43,.17), transparent 62%),
      radial-gradient(880px 560px at -6% 102%, rgba(239,31,43,.09), transparent 58%) !important; }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image: repeating-linear-gradient(0deg, rgba(239,31,43,.033) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(90deg, rgba(239,31,43,.033) 0 1px, transparent 1px 52px); }
  h1 { text-transform:uppercase; letter-spacing:.13em; font-size:23px; color:#fff;
    text-shadow:0 0 20px rgba(239,31,43,.6); }
  h2 { color:#fff; }
  .panel { background:var(--panel); border:1px solid rgba(239,31,43,.18); backdrop-filter:blur(9px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.045); }
  .lvl { background:#0b0b10 !important; border:1px solid #26262f !important; }
  .banner { background:rgba(239,31,43,.07) !important; border-color:rgba(239,31,43,.45) !important; }
  .banner b { color:#ff8f98; }
  .btn { background:linear-gradient(180deg,#ff3b4e,#b60f1b) !important; border:1px solid rgba(255,90,110,.55) !important;
    box-shadow:0 0 16px rgba(239,31,43,.45), inset 0 1px 0 rgba(255,255,255,.25) !important;
    font-weight:700; letter-spacing:.05em; transition: box-shadow .2s, transform .1s; }
  .btn:hover { box-shadow:0 0 30px rgba(239,31,43,.75) !important; }
  .btn:active { transform:translateY(1px); }
  .btn.sec { background:rgba(239,31,43,.08) !important; border:1px solid rgba(239,31,43,.4) !important;
    color:#ffb3ba !important; box-shadow:none !important; }
  .tabs button { background:rgba(18,18,26,.7); border:1px solid var(--line); color:var(--mut); }
  .tabs button.on { background:linear-gradient(180deg,#ff3b4e,#b60f1b) !important; border-color:#ff5a66 !important;
    color:#fff !important; box-shadow:0 0 14px rgba(239,31,43,.5) !important; }
  .inst button { background:rgba(18,18,26,.7) !important; }
  .inst button.on { border-color:#ff5a66 !important; background:rgba(239,31,43,.13) !important;
    box-shadow:0 0 14px rgba(239,31,43,.28) !important; }
  input, select, textarea { background:#0b0b10 !important; border:1px solid #2a2a35 !important; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:rgba(239,31,43,.6) !important;
    box-shadow:0 0 12px rgba(239,31,43,.25); }
  .sig .dir { text-shadow:0 0 16px rgba(239,31,43,.5); }
  #app.locked { display:none; }
  /* ---- access gate ---- */
  #gate { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
    background:#050505;
    background-image: radial-gradient(900px 520px at 68% -6%, rgba(239,31,43,.22), transparent 60%),
      radial-gradient(700px 460px at 8% 106%, rgba(239,31,43,.12), transparent 55%);
    transition: opacity .5s; }
  #gate.out { opacity:0; pointer-events:none; }
  #gate::before { content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, rgba(239,31,43,.04) 0 1px, transparent 1px 52px),
      repeating-linear-gradient(90deg, rgba(239,31,43,.04) 0 1px, transparent 1px 52px); }
  #gateCard { position:relative; width:min(400px,92vw); text-align:center;
    background:rgba(16,16,22,.85); border:1px solid rgba(239,31,43,.45); border-radius:16px;
    padding:30px 26px; backdrop-filter:blur(12px);
    box-shadow:0 0 60px rgba(239,31,43,.25), inset 0 1px 0 rgba(255,255,255,.06); }
  #gateCard.shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-9px)} 75%{transform:translateX(9px)} }
  #gateCard img, #gateCard svg { width:118px; height:118px; filter: drop-shadow(0 0 22px rgba(239,31,43,.55)); }
  #gateCard .brand { font-size:20px; font-weight:900; letter-spacing:.22em; color:#fff; margin-top:8px;
    text-shadow:0 0 18px rgba(239,31,43,.65); }
  #gateCard .tag { font-size:10px; letter-spacing:.3em; color:#ff8f98; margin-top:2px; }
  #gateCard input { margin-top:10px; text-align:center; }
  #gateCard button { width:100%; margin-top:14px; padding:11px; font-size:14px; }
  #gateMain .btn { margin-top:9px; }
  #gateMain .btn:first-child { margin-top:4px; }
  #gateMain { margin-top:14px; }
  .hidden { display:none !important; }
  #fmErr { color:#ff4d5e; font-size:12px; min-height:16px; margin-top:8px; }
  #gateCard .foot2 { font-size:10px; color:#6b6b78; margin-top:14px; letter-spacing:.08em; }
</style>

  var nativeFetch = window.fetch.bind(window);
  function extractJSON(txt){
    var base = txt.indexOf('Markdown Content:'); base = base < 0 ? 0 : base + 16;
    var s = -1;
    for (var i = base; i < txt.length; i++){ var c0 = txt.charAt(i); if (c0 === '{' || c0 === '['){ s = i; break; } }
    if (s < 0) return txt;
    var stack = [], map = { '{': '}', '[': ']' }, inStr = false, esc = false;
    for (var i = s; i < txt.length; i++){
      var c = txt.charAt(i);
      if (inStr){ if (esc) esc = false; else if (c === '\\') esc = true; else if (c === '"') inStr = false; continue; }
      if (c === '"') inStr = true;
      else if (c === '{' || c === '[') stack.push(map[c]);
      else if (c === '}' || c === ']'){
        if (stack.length && stack[stack.length - 1] === c){ stack.pop(); if (!stack.length) return txt.slice(s, i + 1); }
      }
    }
    return txt.slice(s);
  }
  window.fetch = function(input, init){
    var u = (typeof input === 'string') ? input : ((input && input.url) || '');
    var isFeed = /^(https?:\/\/)?(query[12]\.finance\.yahoo\.com|nfs\.faireconomy\.media)/i.test(u);
    if (!isFeed || (init && init.method && init.method !== 'GET')) return nativeFetch(input, init);
    return nativeFetch(input, init).then(function(r){
      if (r.ok) return r;
      throw new Error('direct status ' + r.status);
    }).catch(function(){
      return nativeFetch('https://r.jina.ai/' + u, { cache: 'no-store' }).then(function(r2){
        return r2.text().then(function(txt){
          return new Response(extractJSON(txt), { status: r2.ok ? 200 : 502, headers: { 'content-type': 'application/json' } });
        });
      });
    });
  };
})();

function b64d(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function b64e(b){ var s = ''; for (var i=0;i<b.length;i++) s += String.fromCharCode(b[i]); return btoa(s); }
function fmInject(html){
  var t = document.createElement('template');
  t.innerHTML = html;
  var m = document.getElementById('appMount');
  m.appendChild(document.importNode(t.content, true));
  Array.prototype.slice.call(m.querySelectorAll('script')).forEach(function(old){
    var s = document.createElement('script');
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
}
function fmLockState(){ var p = (sessionStorage.getItem('fm_lock') || '0|0').split('|'); return { n: +p[0], until: +p[1] }; }
function fmLockPenalty(){
  var L = fmLockState(); L.n = (L.n || 0) + 1;
  var msg = 'ACCESS DENIED — invalid credentials';
  if (L.n >= 5){ L.until = Date.now() + Math.min(600000, 30000 * Math.pow(2, L.n - 5)); msg = 'ACCESS DENIED — LOCKED ' + Math.ceil((L.until - Date.now())/1000) + 's'; }
  sessionStorage.setItem('fm_lock', L.n + '|' + (L.until || 0));
  return msg;
}
async function unwrapKey(cred, salt, iv, wrap){
  var enc = new TextEncoder();
  var bk = await crypto.subtle.importKey('raw', enc.encode(cred), 'PBKDF2', false, ['deriveKey']);
  var wk = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64d(salt), iterations:600000, hash:'SHA-256' }, bk, { name:'AES-GCM', length:256 }, true, ['decrypt']);
  var raw = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(iv) }, wk, b64d(wrap));
  return new Uint8Array(raw);
}
async function importMain(k){
  var parts = FM_VAULT.split('.');
  var key = await crypto.subtle.importKey('raw', k, 'AES-GCM', false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(parts[0]) }, key, b64d(parts[1]));
  return new TextDecoder().decode(plain);
}
async function ownerUnlock(em, pw){
  var kp = FM_KEYS.split('|')[0].split('.');
  var k = await unwrapKey(em + '|' + pw, kp[0], kp[1], kp[2]);
  sessionStorage.setItem('fm_key', b64e(k));
  sessionStorage.setItem('fm_role', 'owner');
  return await importMain(k);
}
async function licUnlock(key, em){
  if (!gateDb) throw new Error('offline');
  var doc = await gateDb.collection('licenses').doc(key).get();
  if (!doc.exists) throw new Error('no-license');
  var L = doc.data();
  if (String(L.email).toLowerCase() !== em) throw new Error('email-mismatch');
  var code = L.vaultCode;
  if (!code) throw new Error('no-code');
  var kp = FM_KEYS.split('|')[1].split('.');
  var k = await unwrapKey('vault|' + code, kp[0], kp[1], kp[2]);
  sessionStorage.setItem('fm_key', b64e(k));
  sessionStorage.setItem('fm_role', 'license');
  sessionStorage.setItem('fm_lic', JSON.stringify({ key: key, email: em }));
  return await importMain(k);
}
async function fmRestore(){
  var k = sessionStorage.getItem('fm_key');
  if (!k) return null;
  try {
    var lic = sessionStorage.getItem('fm_lic');
    if (lic){
      if (!gateDb) throw new Error('offline');
      var L = JSON.parse(lic);
      var doc = await gateDb.collection('licenses').doc(L.key).get();
      if (!doc.exists || String(doc.data().email).toLowerCase() !== L.email) throw new Error('revoked');
    }
    return await importMain(b64d(k));
  } catch(e){ sessionStorage.removeItem('fm_key'); sessionStorage.removeItem('fm_lic'); return null; }
}
function gateErr(msg){

function gateMode(m){

  var el = document.getElementById(show);

  gateErr('');
}
function gateOpen(){
  var g = document.getElementById('gate');

}
async function fmLogin(){
  var err = document.getElementById('fmErr');
  var L = fmLockState();
  if (Date.now() < L.until){ gateErr('LOCKED OUT — retry in ' + Math.ceil((L.until - Date.now())/1000) + 's'); return; }
  var em = document.getElementById('fmEmail').value.trim();
  var pw = document.getElementById('fmPass').value;
  if (!em || !pw){ gateErr('Enter email and password.'); return; }
  err.textContent = 'UNLOCKING VAULT…';
  try {
    var html = await ownerUnlock(em, pw);
    sessionStorage.removeItem('fm_lock');
    fmInject(html);
    gateOpen();
    err.textContent = '';
  } catch(e){ gateErr(fmLockPenalty()); }
}
async function keyLogin(){
  var L = fmLockState();
  if (Date.now() < L.until){ gateErr('LOCKED OUT — retry in ' + Math.ceil((L.until - Date.now())/1000) + 's'); return; }
  var em = document.getElementById('lkEmail').value.trim().toLowerCase();
  var key = document.getElementById('lkKey').value.trim().toUpperCase();
  if (!em || !key){ gateErr('Enter your email and license key.'); return; }
  gateErr('⏳ CHECKING LICENSE WITH SERVER…');
  try {
    var html = await licUnlock(key, em);
    sessionStorage.removeItem('fm_lock');
    fmInject(html);
    gateOpen();
    gateErr('');
  } catch(e){ gateErr(fmLockPenalty() + '<br><span style=font-size:11px>Key not found, expired, revoked — or no internet.</span>'); }
}
async function applyAccess(){
  var f = document.getElementById('apFirst').value.trim();
  var s = document.getElementById('apSur').value.trim();
  var em = document.getElementById('apEmail').value.trim();
  var wa = document.getElementById('apWa').value.trim();
  var digits = wa.replace(/[^0-9]/g, '');
  if (!f || !s || em.indexOf('@') === -1 || digits.length < 7){ gateErr('Fill in all fields — name, surname, valid email, WhatsApp number.'); return; }
  if (!gateDb){ gateErr('No internet connection — applications need to reach the server.'); return; }
  gateErr('⏳ Submitting application…');
  try {
    await gateDb.collection('applications').add({ firstName: f, surname: s, email: em.toLowerCase(), whatsapp: wa, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp() });

    gateErr('');
  } catch(e){ gateErr('Could not submit — check your internet connection and try again.'); }
}
