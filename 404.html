<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FM Sniper Lab — redirecting</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#f4f4f5;
    font:15px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;-webkit-text-size-adjust:100%}
  .box{max-width:340px;padding:24px}
  .brand{margin-top:14px;font-weight:900;letter-spacing:.22em;color:#fff}
  .sub{margin-top:8px;color:#b9b9c6;font-size:13.5px}
  a.btn{display:inline-block;margin-top:18px;padding:12px 24px;border-radius:999px;
    background:linear-gradient(180deg,#ff3b4e,#b60f1b);color:#fff;font-weight:800;
    letter-spacing:.1em;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <svg viewBox="0 0 100 100" width="84" height="84" aria-hidden="true">
    <defs>
      <linearGradient id="r" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ff5a66"/><stop offset=".55" stop-color="#ef1f2b"/><stop offset="1" stop-color="#8c0a12"/>
      </linearGradient>
      <linearGradient id="s" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c9ccd4"/><stop offset="1" stop-color="#767b85"/>
      </linearGradient>
    </defs>
    <ellipse cx="50" cy="54" rx="46" ry="21" fill="none" stroke="url(#r)" stroke-width="2.4" transform="rotate(-14 50 54)"/>
    <text x="50" y="68" font-family="Arial Black,Arial" font-size="40" font-weight="900" font-style="italic" text-anchor="middle">
      <tspan fill="url(#r)">F</tspan><tspan fill="url(#s)">M</tspan>
    </text>
  </svg>
  <div class="brand">FM SNIPER LAB</div>
  <div class="sub" id="msg">That link is not the app. Opening the terminal…</div>
  <a class="btn" id="go" href="#">OPEN FM SNIPER LAB</a>
</div>
<script>
/* GitHub Pages serves this file for any missing path in the repo.
   Send the visitor to the repo root (the app), whatever path they asked for. */
(function () {
  var seg = location.pathname.split("/").filter(Boolean)[0];
  var root = location.origin + "/" + (seg ? seg + "/" : "");
  var go = document.getElementById("go");
  if (go) go.href = root;
  if (location.href.split("#")[0].split("?")[0] !== root) {
    setTimeout(function () { location.replace(root); }, 1200);
  } else {
    var m = document.getElementById("msg");
    if (m) m.textContent = "The app files are missing from this site. Upload index.html, manifest.json and sw.js.";
  }
})();
</script>
</body>
</html>
